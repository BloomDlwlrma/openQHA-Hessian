[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openqha-hessian"
version = "0.1.0"
description = "Hessian learning for openQHA: the loss side of fine-tuning MACE-OFF23 on reference E-F-H Labels"
requires-python = ">=3.10"

# The fork's stack (pyproject.toml of BloomDlwlrma/mace): setuptools, flat one-package
# layout. No dependencies are declared until ticket 05 ("Install and transport") settles
# how a machine gets openQHA (a checkout today, not a distribution) and the mace fork;
# the working env is three things -- openQHA checkout, this package, the fork -- and pip
# must not try to resolve the two that have no PyPI form.
[tool.setuptools]
packages = ["openqha_hessian"]
